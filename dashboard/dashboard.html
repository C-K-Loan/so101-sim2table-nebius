<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🤖 Arm Hack Dashboard</title>
<style>
  body { font-family: -apple-system, ui-monospace, monospace; background: #0b0d10; color: #c8d1d9; padding: 16px; margin: 0; }
  h1 { color: #58a6ff; margin: 0 0 4px; font-size: 20px; }
  .sub { color: #8b949e; margin-bottom: 20px; font-size: 12px; }
  .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 600px) { .grid-top { grid-template-columns: 1fr; } }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; }
  .card h2 { margin: 0 0 10px; color: #e6edf3; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stage { display: flex; align-items: center; margin: 6px 0; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
  .dot.done { background: #238636; }
  .dot.running { background: #d29922; animation: pulse 1.4s infinite; }
  .dot.pending { background: #30363d; }
  .dot.failed { background: #da3633; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .stage-name { flex: 1; }
  .stage-eta { color: #8b949e; font-size: 11px; }
  .counter { display: inline-block; padding: 2px 10px; background: #1f6feb; color: white; border-radius: 10px; font-size: 11px; margin-left: 8px; }
  .diary { max-height: 500px; overflow-y: auto; }
  .diary-entry { padding: 8px 0; border-bottom: 1px dashed #30363d; font-size: 12px; }
  .diary-entry:last-child { border-bottom: none; }
  .diary-ts { color: #58a6ff; font-weight: 600; }
  .diary-tag { display: inline-block; padding: 1px 6px; background: #30363d; color: #c8d1d9; border-radius: 4px; font-size: 10px; margin: 0 4px; }
  .diary-body { color: #c8d1d9; margin-top: 2px; white-space: pre-wrap; word-wrap: break-word; }
  .artifact { font-size: 12px; padding: 4px 0; }
  .artifact a { color: #58a6ff; text-decoration: none; }
  .artifact a:hover { text-decoration: underline; }
  .artifact-meta { color: #8b949e; font-size: 10px; margin-left: 6px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px; }
  .pill.live { background: #238636; color: white; }
  .pill.wait { background: #d29922; color: #0b0d10; }
  .pill.fail { background: #da3633; color: white; }
  .refresh-note { color: #8b949e; font-size: 10px; margin-top: 10px; text-align: right; }
  .score-bar { height: 20px; background: #30363d; border-radius: 10px; overflow: hidden; margin: 4px 0 10px; position: relative; }
  .score-fill { height: 100%; background: linear-gradient(90deg, #238636, #58a6ff); transition: width 0.5s; }
  .score-label { position: absolute; width: 100%; text-align: center; line-height: 20px; font-size: 11px; color: white; font-weight: 600; }
</style>
</head>
<body>

<h1>🤖 Arm Hack Dashboard</h1>
<div class="sub">
  <span class="pill live">LIVE</span>
  <span id="submit-countdown">loading submit countdown...</span>
</div>

<div class="grid-top">

<div class="card">
  <h2>📊 Pipeline</h2>
  <div id="stages"></div>
</div>

<div class="card">
  <h2>🏆 Projected Score</h2>
  <div class="score-bar">
    <div class="score-fill" id="score-fill" style="width: 0%"></div>
    <div class="score-label" id="score-label">0 / 100</div>
  </div>
  <div id="score-breakdown" style="font-size: 11px; color: #c8d1d9;"></div>
</div>

</div>

<div class="card">
  <h2>🗂️ Artifacts</h2>
  <div id="artifacts"></div>
</div>

<br>

<div class="card">
  <h2>📔 Dev Diary</h2>
  <div class="diary" id="diary"></div>
</div>

<div class="refresh-note" id="refresh-note">loading...</div>

<script>
const stages = [
  { id: 'vm_up', name: 'VM provisioned (RTX PRO 6000)' },
  { id: 'isaac_installed', name: 'Isaac Sim + Lab + GR00T installed' },
  { id: 'groot_weights', name: 'GR00T N1.7-3B weights local' },
  { id: 'nim_pulled', name: 'Cosmos NIMs pulled (Transfer + Reason)' },
  { id: 'sim_collect', name: 'Sim episodes (collect.sh)' },
  { id: 'cosmos_transfer', name: 'Cosmos Transfer pass' },
  { id: 'cosmos_reason', name: 'Cosmos Reason curation' },
  { id: 'teleop_recorded', name: 'Real teleop episodes (CKL)' },
  { id: 'dataset_prepared', name: 'Dataset merged + prepared' },
  { id: 'training', name: 'GR00T fine-tune (main)' },
  { id: 'ablation', name: 'Ablation train (sim-only)' },
  { id: 'eval_sim', name: 'Closed-loop sim eval' },
  { id: 'deploy_real', name: 'Deploy to real arm' },
  { id: 'judge_trials', name: 'Judge trials (3 shots)' },
  { id: 'submission', name: 'Submission uploaded' },
];

async function load() {
  let status = {};
  let events = [];
  let artifacts = [];
  try { status = await (await fetch('status.json?' + Date.now())).json(); } catch(e) {}
  try { events = await (await fetch('events.jsonl?' + Date.now())).text().then(t => t.trim().split('\n').filter(x => x).map(JSON.parse).reverse()); } catch(e) {}
  try { artifacts = await (await fetch('artifacts.json?' + Date.now())).json(); } catch(e) {}

  // Submit countdown
  const submitTs = new Date('2026-10-18T17:30:00+02:00');
  const now = new Date();
  const msLeft = submitTs - now;
  const hrs = Math.floor(msLeft / 3600000);
  const min = Math.floor((msLeft % 3600000) / 60000);
  document.getElementById('submit-countdown').textContent =
    msLeft > 0 ? `⏱️ ${hrs}h ${min}m to 17:30 submit` : `⏱️ SUBMIT WINDOW CLOSED`;

  // Stages
  const stagesEl = document.getElementById('stages');
  stagesEl.innerHTML = '';
  for (const s of stages) {
    const st = status[s.id] || {state: 'pending'};
    const el = document.createElement('div');
    el.className = 'stage';
    const counter = st.count !== undefined ? `<span class="counter">${st.count}</span>` : '';
    const eta = st.eta ? `<span class="stage-eta">${st.eta}</span>` : '';
    el.innerHTML = `<div class="dot ${st.state}"></div><div class="stage-name">${s.name}${counter}</div>${eta}`;
    stagesEl.appendChild(el);
  }

  // Projected score
  const sc = status._projected_score || {};
  const total = sc.total || 0;
  document.getElementById('score-fill').style.width = (total) + '%';
  document.getElementById('score-label').textContent = `${total} / 100`;
  const breakdown = sc.breakdown || {};
  document.getElementById('score-breakdown').innerHTML =
    Object.entries(breakdown).map(([k, v]) => `<div>${k}: <b>${v.points}</b> ${v.note ? ' -  ' + v.note : ''}</div>`).join('');

  // Diary
  const diaryEl = document.getElementById('diary');
  diaryEl.innerHTML = events.map(e => `
    <div class="diary-entry">
      <span class="diary-ts">${e.ts.slice(11,19)}</span>
      <span class="diary-tag">${e.phase || '-'}</span>
      <b>${e.title}</b>
      ${e.body ? `<div class="diary-body">${e.body}</div>` : ''}
    </div>
  `).join('') || '<div style="color: #8b949e; font-size: 12px;">(no events yet)</div>';

  // Artifacts
  const artEl = document.getElementById('artifacts');
  artEl.innerHTML = artifacts.length ? artifacts.map(a => `
    <div class="artifact">
      <a href="${a.href}" target="_blank">${a.name}</a>
      ${a.size ? `<span class="artifact-meta">${a.size}</span>` : ''}
      ${a.ts ? `<span class="artifact-meta">${a.ts}</span>` : ''}
      ${a.note ? `<span class="artifact-meta">${a.note}</span>` : ''}
    </div>
  `).join('') : '<div style="color: #8b949e; font-size: 12px;">(no artifacts yet, auto-adds when files land)</div>';

  document.getElementById('refresh-note').textContent = `refreshed ${new Date().toLocaleTimeString()}`;
}

load();
setInterval(load, 10000);
</script>
</body>
</html>
